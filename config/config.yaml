# STT 실행 장치. cpu = CPU, auto = CUDA 사용 가능 시 GPU.
device: cpu

stt:
  # seastar105/whisper-medium-komixv2를 openai-whisper 형식으로 변환한 가중치.
  model: komixv2
  language: ko
  model_dir: models/whisper          # 가중치 위치 (komixv2.pt)
  # KoMixV2는 타임스탬프 없이 전사한다.
  decode_options:
    without_timestamps: true
  # Silero VAD v6.2.3. 긴 음성은 쉼을 기준으로 분할한다.
  vad_dir: models/vad/silero-vad
  max_chunk_sec: 28                  # 분할 구간 길이 기준(초)
  long_pause_sec: 1.0                # 우선 분할할 쉼의 최소 길이(초)

llm:
  host: http://localhost:11434
  # Qwen3-4B-Instruct-2507 (Q4_K_M), Ollama 로컬 실행.
  model: qwen3:4b-instruct
  # 현재 Instruct 모델에는 think 옵션을 전달하지 않는다.
  think: null
  # 0 = CPU, null = Ollama 자동 배치. 모델 경로: OLLAMA_MODELS=models/ollama.
  num_gpu: 0
  timeout_sec: 300                   # Ollama 요청 제한 시간(초)
  # 사연 생성 프롬프트. SHA256이 다르면 실행을 중단한다.
  prompt_path: prompts/story.md
  prompt_sha256: b073765a98c309a7e1c9273bb9177111a0fb008b370aab6cf5994b8758ccd9d9
  # 형식 검사 R2: 공백 포함 글자 수 상한.
  target_chars:
    max: 308

tts:
  # Supertonic 한국어 음성. 속도·합성 단계 수는 라이브러리 기본값.
  voice: M1
  lang: ko
  model_dir: models/supertonic       # 가중치 위치. 없으면 여기로 내려받는다

pipeline:
  out_wav_name: story.wav
  # 후처리에서 적용할 도입·마무리 문구.
  intro: "오늘의 사연 주인공은 {nickname}이에요."
  closing: "비슷한 경험이 있으신 분은 {nickname}께 이야기를 들려주세요."

# 평가 입력: manifest·wav·원본 정답 전사문.
eval_set:
  out_dir: data/eval_set
dev_set:
  out_dir: data/dev_set
dev_clear:
  out_dir: data/dev_clear

# 로컬 평가 장치는 생성용 device 설정과 독립적이다.
judge:
  model: laya-real400-repair001
  model_dir: models/laya
  questions_path: models/laya/questions.json
  weights_sha256: ae3949e8b843fd143fdf9737511d449ae983b0da3af3fd3debbad90ada6b209f
  questions_sha256: d7565de9c7e8034aa86ff555d232e0cbdcc1278288cc2770d53b267c83a2e7e0
  device: auto
  binary_threshold: 0.5
  max_len: 1024
  head_max_len: 1024

# 평가 실행. 규칙·산식은 docs/평가지표.md 참고.
eval:
  results_dir: results
  reps: 1                   # 샘플당 실행 횟수. 워밍업 1건은 별도 실행 후 집계 제외.
  e2e_timeout_sec: 120      # ③ E2E 성공 기준
  intro: "오늘의 사연 주인공은"   # R6
  thresholds:               # 지표별 합격선(%)
    fact_recall_macro: 95
    inconsistency_rate: 5
    format_rate: 90
    e2e_success_rate: 95
    overall_pass_rate: 90
